<!DOCTYPE html>
<!--
  Hyginix — Log Extra

  Two screens: LOG (record one extra) and HISTORY (check and undo).

  Layout rule for this file: one column, one rhythm. Every control is full
  width or sits on an even grid, every row is the same height, and there is one
  type scale. The first version wrapped variable-width chips and looked ragged;
  nothing here is allowed to wrap unevenly.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A7A7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Log Extra">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Log Extra</title>
<style>
  :root {
    --teal:#1A7A7A; --teal-mid:#2A9B9B; --teal-pale:#EDF6F5;
    --ink:#12201f; --muted:#667877; --line:#dbe6e5; --bg:#f5f8f8; --card:#fff;
    --green:#1B7F3B; --green-bg:#E6F5EA; --red:#C0392B; --red-bg:#FCECEA;
    --r:14px;              /* one corner radius everywhere */
    --h:56px;              /* one control height everywhere */
    --gap:10px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:17px; line-height:1.35; -webkit-text-size-adjust:100%; }
  body { padding-bottom:calc(96px + env(safe-area-inset-bottom)); }

  /* ---- chrome ---- */
  header { position:sticky; top:0; z-index:20; background:var(--teal); color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 16px 0; }
  .htop { display:flex; align-items:center; justify-content:space-between; min-height:34px; }
  .htop h1 { font-size:17px; font-weight:700; letter-spacing:.2px; }
  .qbadge { font-size:12px; font-weight:700; background:rgba(255,255,255,.22);
    padding:5px 11px; border-radius:99px; display:none; }
  .qbadge.on { display:inline-block; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; margin-top:8px; }
  .tab { background:none; border:none; color:rgba(255,255,255,.72); font-family:inherit;
    font-size:15px; font-weight:700; padding:12px 0; cursor:pointer;
    border-bottom:3px solid transparent; }
  .tab.on { color:#fff; border-bottom-color:#fff; }

  main { padding:16px; }
  .field { margin-bottom:20px; }
  .lbl { font-size:12px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px; }

  /* ---- one control style, used by every input and button ---- */
  .ctl {
    display:flex; align-items:center; width:100%; min-height:var(--h);
    border:1.5px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:var(--r); padding:0 16px; font-size:17px; font-family:inherit;
  }
  input.ctl { -webkit-appearance:none; appearance:none; }
  input.ctl:focus, select.ctl:focus { outline:none; border-color:var(--teal-mid); box-shadow:0 0 0 3px rgba(42,155,155,.14); }
  /* Native <select>: on a phone this opens the OS picker — compact, familiar,
     and it keeps the whole form on one screen. Fifteen full-width option rows
     pushed How much and When below the fold. */
  select.ctl {
    -webkit-appearance:none; appearance:none; font-weight:600;
    padding-right:44px; background-repeat:no-repeat;
    background-position:right 16px center; background-size:12px 8px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23667877' stroke-width='2' stroke-linecap='round'/></svg>");
  }
  select.ctl.unset { color:var(--muted); font-weight:500; }

  /* ---- a stack of full-width option rows: never ragged ---- */
  .stack { display:flex; flex-direction:column; gap:var(--gap); }
  .opt { justify-content:space-between; text-align:left; cursor:pointer; font-weight:600; }
  .opt.on { background:var(--teal); border-color:var(--teal); color:#fff; }
  .opt .tick { opacity:0; font-weight:800; }
  .opt.on .tick { opacity:1; }
  .opt.ghost { border-style:dashed; color:var(--muted); }

  /* ---- even grids: 2 or 3 equal columns, never wrapping unevenly ---- */
  .g2 { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--gap); }
  .g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--gap); }
  .g2 .ctl, .g3 .ctl { justify-content:center; font-weight:700; padding:0 8px; cursor:pointer; }
  .g2 .ctl.on, .g3 .ctl.on { background:var(--teal); border-color:var(--teal); color:#fff; }

  .amtwrap { display:grid; grid-template-columns:var(--h) 1fr; gap:var(--gap); }
  .sign { justify-content:center; font-size:24px; font-weight:800; cursor:pointer; padding:0; }
  .sign.minus { background:var(--red-bg); border-color:#EFC0BA; color:var(--red); }
  #amt { text-align:right; font-size:22px; font-weight:800; }

  .picked { display:flex; align-items:center; justify-content:space-between;
    background:var(--teal-pale); border:1.5px solid var(--teal-mid); border-radius:var(--r);
    min-height:var(--h); padding:0 8px 0 16px; font-weight:700; }
  .picked button { background:none; border:none; color:var(--teal); font-size:15px;
    font-weight:700; font-family:inherit; padding:12px 14px; cursor:pointer; }
  .results { display:flex; flex-direction:column; gap:var(--gap); margin-top:var(--gap); }
  .empty { color:var(--muted); font-size:15px; padding:10px 2px; }

  /* ---- bottom action ---- */
  .save { position:fixed; left:0; right:0; bottom:0; z-index:20; padding:12px 16px
    calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 74%, rgba(245,248,248,0)); }
  .save button { width:100%; min-height:60px; border:none; border-radius:var(--r);
    background:var(--teal); color:#fff; font-size:19px; font-weight:800; font-family:inherit; cursor:pointer; }
  .save button:disabled { background:#c8d5d4; color:#8a9a99; }

  /* ---- history ---- */
  .row { background:var(--card); border:1.5px solid var(--line); border-radius:var(--r);
    padding:14px 16px; margin-bottom:var(--gap); }
  .row .top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .row .nm { font-weight:700; }
  .row .amt { font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .row .amt.neg { color:var(--red); }
  .row .meta { color:var(--muted); font-size:14px; margin-top:4px; }
  .row .act { margin-top:12px; }
  .row .act button { width:100%; min-height:46px; border-radius:11px; border:1.5px solid #EFC0BA;
    background:var(--red-bg); color:var(--red); font-size:15px; font-weight:700;
    font-family:inherit; cursor:pointer; }
  .row.void { opacity:.62; }
  .row.void .nm, .row.void .amt { text-decoration:line-through; }
  .voidtag { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.8px;
    text-transform:uppercase; background:var(--red-bg); color:var(--red);
    padding:3px 9px; border-radius:99px; margin-top:8px; }

  .toast { position:fixed; left:16px; right:16px; bottom:calc(84px + env(safe-area-inset-bottom));
    z-index:30; border-radius:12px; padding:15px 16px; font-size:16px; font-weight:700;
    display:none; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .toast.on { display:block; animation:pop .18s ease-out; }
  .toast.ok { background:var(--green-bg); color:var(--green); }
  .toast.err { background:var(--red-bg); color:var(--red); }
  @keyframes pop { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

  #setup { padding:24px 18px; }
  #setup h2 { font-size:21px; margin-bottom:6px; }
  #setup p { color:var(--muted); font-size:15px; margin-bottom:18px; }
  #setup .lbl { margin-top:16px; }
  #setup button { width:100%; min-height:58px; border:none; border-radius:var(--r);
    background:var(--teal); color:#fff; font-size:18px; font-weight:800;
    font-family:inherit; margin-top:22px; cursor:pointer; }
  .hint { font-size:14px; color:var(--muted); margin-top:10px; }
  .hidden { display:none !important; }
</style>

<div id="setup" class="hidden">
  <h2>Set up once</h2>
  <p>Only needed the first time on this phone.</p>
  <div class="lbl">App URL</div>
  <input type="text" id="s_url" class="ctl" placeholder="https://script.google.com/…/exec" autocomplete="off">
  <div class="lbl">Device key</div>
  <input type="text" id="s_key" class="ctl" placeholder="key from the spreadsheet" autocomplete="off">
  <button onclick="saveSetup()">Save and start</button>
  <div class="hint">Ask for the setup link instead and this fills in by itself.</div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="htop">
      <h1>Log Extra</h1>
      <span class="qbadge" id="qbadge"></span>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabLog" onclick="showTab('log')">Log</button>
      <button class="tab" id="tabHist" onclick="showTab('hist')">History</button>
    </div>
  </header>

  <!-- ---------------- LOG ---------------- -->
  <main id="viewLog">
    <div class="field">
      <div class="lbl">Who</div>
      <div id="whoPicked" class="picked hidden">
        <span id="whoName"></span><button onclick="clearWho()">Change</button>
      </div>
      <div id="whoSearchWrap">
        <input type="search" id="whoSearch" class="ctl" placeholder="Search employee…"
               autocomplete="off" autocapitalize="words">
        <div class="results" id="whoResults"></div>
      </div>
    </div>

    <div class="field">
      <div class="lbl">Why</div>
      <select class="ctl unset" id="whySelect" onchange="onWhyChange()"></select>
      <div id="whyOtherWrap" class="hidden" style="margin-top:10px">
        <input type="text" id="whyOther" class="ctl" placeholder="Type the reason…">
        <div class="hint">Saved to the list, so you only type it once.</div>
      </div>
    </div>

    <div class="field">
      <div class="lbl">How much</div>
      <div class="g3" id="amtGrid" style="margin-bottom:10px"></div>
      <div class="amtwrap">
        <button class="ctl sign" id="signBtn" onclick="toggleSign()">+</button>
        <input type="number" id="amt" class="ctl" inputmode="numeric" placeholder="0" oninput="render()">
      </div>
    </div>

    <div class="field">
      <div class="lbl">When</div>
      <div class="g3" id="whenGrid"></div>
      <div id="whenPickWrap" class="hidden" style="margin-top:10px">
        <input type="date" id="whenDate" class="ctl" onchange="onDateChange()">
      </div>
    </div>
  </main>

  <!-- ---------------- HISTORY ---------------- -->
  <main id="viewHist" class="hidden">
    <div class="field">
      <input type="search" id="histSearch" class="ctl" placeholder="Filter by employee…"
             autocomplete="off" oninput="renderHistory()">
    </div>
    <div id="histList"></div>
  </main>

  <div class="save" id="saveBar"><button id="saveBtn" disabled onclick="save()">Save</button></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
